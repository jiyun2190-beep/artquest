<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ART QUEST — Polished Chromebook RPG</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#07111d;color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif}body{min-width:900px}
#app{width:min(1366px,100%);margin:auto}.screen{display:none}.screen.on{display:block}.top{height:60px;background:#09172a;border-bottom:2px solid #d3a653;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.logo{font:900 27px Georgia;color:#f1c76e}.hud{display:flex;gap:13px;align-items:center;font-weight:800}.xpbar{width:135px;height:11px;background:#29374a;border-radius:10px;overflow:hidden}.xpbar i{display:block;height:100%;background:#efbd50}
.game{position:relative;width:100%;aspect-ratio:1366/708;overflow:hidden;background:#19324a}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(#0001,#0000 70%,#0004);pointer-events:none}
.player{position:absolute;width:112px;height:144px;object-fit:contain;z-index:12;transform:translate(-50%,-78%);filter:drop-shadow(0 5px 3px #0008)}.npc{position:absolute;width:126px;height:164px;object-fit:contain;z-index:9;transform:translate(-50%,-78%);filter:drop-shadow(0 5px 3px #0008)}
.obj{position:absolute;object-fit:contain;z-index:8;transform:translate(-50%,-65%);filter:drop-shadow(0 5px 3px #0007)}.quest{position:absolute;z-index:10;width:46px;transform:translate(-50%,-50%);animation:bob .8s infinite alternate}@keyframes bob{to{margin-top:-8px}}
.tag{position:absolute;z-index:11;background:#f2d9a1;color:#2d1d0c;border:2px solid #76501d;border-radius:7px;padding:4px 9px;font-weight:900;transform:translate(-50%,-50%);white-space:nowrap}.prompt{position:absolute;z-index:25;bottom:16px;left:50%;transform:translateX(-50%);background:#071527ef;border:2px solid #e1b657;border-radius:10px;padding:10px 18px;font-weight:900;display:none}
.controls{height:58px;background:#081525;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;color:#cad5e4}.controls button{min-height:36px;padding:5px 11px}button,input{font:inherit}button{cursor:pointer;min-height:46px;border:1px solid #667995;border-radius:9px;background:#142943;color:#fff;padding:10px 16px;font-weight:800}button:hover,button:focus{outline:3px solid #ffda74}.gold{background:linear-gradient(#f2ce79,#bb7c20);color:#241600;border:0}
.panel{background:#0a192bee;border:2px solid #bd9147;border-radius:14px;padding:18px;box-shadow:0 8px 28px #0008}.center{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:660px;text-align:center}.title{font:900 68px Georgia;color:#f1c76e;text-shadow:0 4px #513715}.pickrow{display:flex;justify-content:center;gap:25px}.pick{width:230px;height:300px}.pick img{height:255px;max-width:100%;object-fit:contain}.pick.sel{outline:5px solid #ffda70}input{width:350px;padding:12px;font-size:18px;border-radius:9px;background:#081425;color:white;border:2px solid #667995}
.dialog{position:absolute;z-index:35;left:4%;right:4%;bottom:3%;min-height:155px;background:#f1dfb8;color:#281d0e;border:4px solid #78521d;border-radius:13px;padding:18px 180px 18px 24px;font-size:19px;line-height:1.55}.dialog b{color:#704812}.dialog button{position:absolute;right:20px;bottom:20px}.mission{position:absolute;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);width:780px;max-height:92%;overflow:auto}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.opts button{background:#fff8e8;color:#271c0d;border-color:#8a6734}.opts .sel{background:#dfbd65}.toast{position:absolute;z-index:60;left:50%;top:14px;transform:translateX(-50%);background:#071525ee;border:2px solid #e2b757;border-radius:10px;padding:12px 18px;font-weight:900}.reward{text-align:center}.reward img{height:190px}.spark{animation:pop .6s}@keyframes pop{0%{transform:scale(.4);opacity:0}80%{transform:scale(1.2)}}.puzzle{display:grid;grid-template-columns:repeat(3,125px);grid-template-rows:repeat(3,150px);gap:3px;justify-content:center}.tile{padding:0;min-height:0;background-image:url("assets/mona.webp");background-size:300% 300%;border:2px solid #b59052}.tile.good{outline:3px solid #70d57a}.mapNode{position:absolute;z-index:7;transform:translate(-50%,-50%);min-width:155px;text-align:center;
background:linear-gradient(#f7e6b8,#d7aa59);color:#291b0b;border:3px solid #74501f;border-radius:12px;
padding:10px 13px;font-weight:950;box-shadow:0 7px 14px #0008,inset 0 0 0 2px #fff4c777;text-shadow:0 1px #fff6}
.mapNode::before{content:"✦";margin-right:6px;color:#8b5419}.mapNode.locked::before{content:"🔒";margin-right:5px}.locked{filter:grayscale(1);opacity:.55}
#title::before{content:"";position:absolute;inset:0;background:url("assets/opening_title.jpg") center/cover no-repeat;z-index:0}
#title>*{position:relative;z-index:1}
</style><style>
#title{background:#142033;overflow:hidden}
#title::before{content:"";position:absolute;inset:0;background:url("assets/opening_title.jpg") center/cover no-repeat;z-index:0}
#title>*{position:relative;z-index:1}
#title .card{background:rgba(10,22,35,.76);backdrop-filter:blur(2px);max-width:460px}
.player{width:116px!important;height:148px!important;object-fit:contain!important}
.chooseCard img{height:285px!important;max-width:260px;object-fit:contain}
</style>
<style>
#title{position:relative;background:#172131!important;overflow:hidden}
#title::before{content:"";position:absolute;inset:0;background:
linear-gradient(90deg,rgba(8,18,28,.05),rgba(8,18,28,.38)),
url("assets/main_title.jpg") center/cover no-repeat!important;z-index:0}
#title>*{position:relative;z-index:2}
#title .card{background:rgba(9,20,32,.82)!important;backdrop-filter:blur(2px);border:2px solid #c89b47}
#choose .chooseCard{max-width:500px}
#nick{font-size:20px!important;padding:13px!important;text-align:center}
#go{font-size:20px!important;padding:13px 22px!important;cursor:pointer}
</style>
<style id="large-character-patch">
.player{width:174px!important;height:222px!important;object-fit:contain!important;
transform:translate(-50%,-82%)!important;transform-origin:center bottom!important;
filter:drop-shadow(0 8px 7px rgba(0,0,0,.35))}
.npc{width:189px!important;height:246px!important;object-fit:contain!important;
transform:translate(-50%,-86%)!important;transform-origin:center bottom!important;
filter:drop-shadow(0 8px 7px rgba(0,0,0,.32))}
</style><style>#hero.player{width:var(--hero-width,240px)!important;height:var(--hero-height,240px)!important;transform:translate(var(--hero-x,-120px),var(--hero-y,-210px))!important;pointer-events:none}</style><link rel="stylesheet" href="upgrade.css"></head><body><div id="app">
<section id="title" class="screen on"><div class="game"><img class="bg" src="assets/main_title.jpg"><div class="shade"></div><div class="center panel"><div class="title">ART QUEST</div><h2>다섯 시대의 힘 · 지윤드래곤의 비밀</h2><p>시대별 미션을 깨고 장비를 모아, 명화의 색을 훔친 지윤드래곤에 도전하세요.</p><button id="start" class="gold">▶ 게임 시작</button></div></div></section>
<section id="choose" class="screen">
      <div class="card chooseCard">
        <h2>ART HUNTER 등록</h2>
        <p>서양미술사의 시간 여행을 떠날 탐험가입니다.</p>
        <img src="assets/hero_down.png" alt="ART HUNTER 탐험가" style="height:270px;object-fit:contain;filter:drop-shadow(0 10px 12px #0007)">
        <input id="nick" maxlength="10" placeholder="탐험가 닉네임">
        <button id="go">탐험 시작</button>
      </div>
    </section>
<section id="play" class="screen"><div class="top"><div class="logo">ART QUEST</div><div class="hud"><span id="pn"></span><span id="hp">❤️❤️❤️</span><span>LV.<b id="lv">1</b></span><div class="xpbar"><i id="bar"></i></div><span><b id="xp">0</b>/100</span><span>🎒 <b id="bag">0</b>/5</span><button id="musicBtn" style="min-height:32px;padding:4px 9px">🎵 BGM</button></div></div><div id="game" class="game"><img id="bg" class="bg"><div class="shade"></div><div id="layer"></div><div id="heroActor" class="actor" aria-label="탐험가"></div><div id="prompt" class="prompt">SPACE · 상호작용</div></div><div id="equipmentBar" class="equipment-bar" aria-label="획득 장비"></div><div class="controls"><button id="guideAction" class="gold">지역 입장</button><span>WASD / 방향키를 누르고 있으면 연속 이동 · SPACE 대화/입장</span><div><button data-k="ArrowLeft">←</button><button data-k="ArrowUp">↑</button><button data-k="ArrowDown">↓</button><button data-k="ArrowRight">→</button><button data-k=" ">SPACE</button></div></div></section>
<section id="end" class="screen"><div class="game"><img class="bg" src="assets/bg_modern.jpg"><div class="center panel reward"><h1>🏆 지윤드래곤 격파!</h1><div class="title" style="font-size:48px">CLEAR!</div><img class="endHero" src="assets/battle_hero_victory.png" alt="모든 장비를 착용한 탐험가"><p id="final"></p><button id="restart" class="gold">처음부터</button></div></div></section></div>
<script src="sprite-metrics.js"></script><script src="game.js"></script>
</body></html>
