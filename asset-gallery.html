<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ART QUEST · 장비와 전투 에셋</title><link rel="stylesheet" href="upgrade.css"><style>body{margin:0;padding:24px;background:#102136;color:#f5e9cf;font-family:system-ui,sans-serif}h1{margin:0 0 10px}p{color:#bdd0df}section{margin:28px 0;padding:18px;border:1px solid #60758c;border-radius:16px;background:#192f45}.views{display:flex;flex-wrap:wrap;gap:8px}.sample{width:240px;height:285px;position:relative;background:#274057;border-radius:12px}.sample .actor{top:25px;left:0}.sample small{position:absolute;top:7px;left:12px}.battle-samples{display:flex;flex-wrap:wrap;gap:16px}.battle-samples figure{width:230px;margin:0;background:#274057;border-radius:12px;padding:10px}.battle-samples img{width:230px;height:250px;object-fit:contain}a{color:#80def1}</style><h1>ART QUEST · 장비 & 전투 에셋</h1><p>미션을 완료할수록 이전 장비 위에 다음 장비가 쌓입니다. 아래는 4방향 장착 모습과 전투 자세입니다.</p><a href="index.html">게임 열기 →</a><div id="gallery"></div><section><h2>지윤드래곤 전투</h2><div id="battleGallery" class="battle-samples"></div></section><script src="sprite-metrics.js"></script><script>function renderActor(el,facing='down',count=0){
 const key=facing+':'+count;
 if(el.dataset.rendered===key)return;
 el.dataset.rendered=key;el.dataset.direction=facing;el.dataset.equipment=count;
 const sprite=(count>0?'crown_':'hero_')+facing,m=SPRITE_METRICS[sprite];
 el.innerHTML=`${count>=5?'<img class="equip aura" src="assets/gear_aura.png" alt="팝아트 오라">':''}${count>=3?'<img class="equip cape" src="assets/gear_cape.png" alt="황금 망토">':''}<img class="bodySprite" src="assets/${sprite}.png" alt="${count?'파라오 왕관을 쓴 ':''}탐험가" style="left:${m.x}px;top:${m.y}px;width:${m.w}px;height:${m.h}px">${count>=2?'<img class="equip brush" src="assets/gear_brush.png" alt="마법 붓">':''}${count>=4?'<img class="equip shield" src="assets/gear_shield.png" alt="팔레트 방패">':''}`;
}

const stages=['기본 탐험가','① 이집트 · 파라오 왕관','② 르네상스 · 마법 붓 추가','③ 바로크·로코코 · 황금 망토 추가','④ 인상주의 · 팔레트 방패 추가','⑤ 현대미술 · 팝아트 오라 추가'];
stages.forEach((label,count)=>{const section=document.createElement('section');section.innerHTML='<h2>'+label+'</h2><div class="views"></div>';for(const [dir,name] of [['down','앞'],['up','뒤'],['left','왼쪽'],['right','오른쪽']]){const s=document.createElement('div');s.className='sample';s.innerHTML='<small>'+name+'</small><div class="actor"></div>';renderActor(s.querySelector('.actor'),dir,count);section.querySelector('.views').appendChild(s)}document.querySelector('#gallery').appendChild(section)});
for(const [file,label] of [['battle_hero_attack','주인공 · 공격'],['battle_hero_guard','주인공 · 방어'],['battle_hero_victory','주인공 · 승리'],['dragon_idle','드래곤 · 대기'],['dragon_attack','드래곤 · 공격'],['dragon_defeat','드래곤 · 패배']]){document.querySelector('#battleGallery').innerHTML+='<figure><img src="assets/'+file+'.png" alt="'+label+'"><figcaption>'+label+'</figcaption></figure>'}
</script></html>
